# SmartShaadi Auto-Blog GitHub Action
# File: .github/workflows/auto-blog.yml

name: 🤖 SmartShaadi Auto Blog Generator

on:
  schedule:
    - cron: '30 17 * * 0'
  workflow_dispatch:
    inputs:
      topic_override:
        description: 'Custom topic slug (optional)'
        required: false
        default: ''
      force_regenerate:
        description: 'Force regenerate (true/false)'
        required: false
        default: 'false'

jobs:
  generate-and-deploy:
    name: Generate Blog & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── FIX: Node setup ko simplified kar diya ──
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Quotes hata diye aur cache bhi remove kar diya filhal

      - name: 📦 Install Dependencies
        run: |
          npm install axios
          echo "✅ Dependencies installed"

      - name: 🔑 Verify API Key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ ERROR: GROQ_API_KEY secret not set!"
            exit 1
          fi
          echo "✅ API key verified"

      - name: 🎯 Handle Topic Override
        if: ${{ github.event.inputs.topic_override != '' }}
        run: echo "TOPIC_OVERRIDE=${{ github.event.inputs.topic_override }}" >> $GITHUB_ENV

      - name: 🔄 Handle Force Regenerate
        if: ${{ github.event.inputs.force_regenerate == 'true' }}
        run: echo "FORCE_REGENERATE=true" >> $GITHUB_ENV

      - name: 🧠 Generate Blog Post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOPIC_OVERRIDE: ${{ env.TOPIC_OVERRIDE }}
          FORCE_REGENERATE: ${{ env.FORCE_REGENERATE }}
        run: node scripts/generate-blog.js

      - name: 🔍 Check for Changes
        id: check_changes
        run: |
          git status
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 👤 Configure Git Identity
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "SmartShaadi Bot"
          git config --global user.email "bot@smartshaadi.online"

      - name: 📤 Commit & Push New Blog
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git commit -m "🤖 Auto-blog update | $(date)"
          git push origin main

      - name: 📊 Job Summary
        if: always()
        run: echo "Job finished with status ${{ job.status }}"
